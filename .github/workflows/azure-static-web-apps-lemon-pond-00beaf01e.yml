name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # 🔑 IMPORTANT: Inject variables into the build here
      - name: Build Vite app
        run: npm run build
        env:
          VITE_API_URL: "https://udyog-sarathi-api-fzfqcwdzepavedd0.centralindia-01.azurewebsites.net/api"
          VITE_USE_MOCK: "false"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_DEPLOY_TOKEN }}
          action: upload
          
          # Deploy ONLY built files
          skip_app_build: true
          app_location: "dist"